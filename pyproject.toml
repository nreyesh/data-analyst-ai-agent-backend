[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=65"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
