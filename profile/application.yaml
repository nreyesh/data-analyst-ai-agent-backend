# ==============================================================================
# Baseline Application Configuration (Common Defaults)
# ==============================================================================
app:
  name: "building-analytics-backend"
  version: "1.0.0"

server:
  host: "0.0.0.0"
  port: 8000

database:
  driver: "postgresql+psycopg"
  host: "localhost"
  port: 5432
  name: "condominium_db"
  user: "postgres"
  pool_size: 10
  max_overflow: 20
  pool_recycle: 1800
  pool_timeout: 30
  pool_pre_ping: true
